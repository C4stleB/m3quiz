<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M3対策クイズ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --bg-secondary: #f5f5f2; --bg-tertiary: #eeece6;
      --text-primary: #1a1a18; --text-secondary: #5f5e5a;
      --border: rgba(0,0,0,0.12); --border-hover: rgba(0,0,0,0.25);
      --radius-md: 8px; --radius-lg: 12px;
      --info-bg: #e6f1fb; --info-text: #185fa5;
      --success-text: #0f6e56;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1c; --bg-secondary: #2a2a28; --bg-tertiary: #161614;
        --text-primary: #f0ede6; --text-secondary: #a09e98;
        --border: rgba(255,255,255,0.12); --border-hover: rgba(255,255,255,0.28);
        --info-bg: #042c53; --info-text: #85b7eb; --success-text: #5dcaa5;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg-tertiary); color: var(--text-primary);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 2rem 1rem 4rem;
    }
    .container { width: 100%; max-width: 720px; }
    header { margin-bottom: 2rem; }
    header h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
    header p { font-size: 14px; color: var(--text-secondary); }

    .progress { height: 3px; background: var(--border); border-radius: 999px; margin-bottom: 1.5rem; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--info-text); border-radius: 999px; transition: width .4s ease; }

    .card {
      background: var(--bg); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1.25rem;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .tag { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: var(--radius-md); margin-bottom: 1rem; }
    .tag-prob  { background: #EEEDFE; color: #3C3489; }
    .tag-math  { background: #E1F5EE; color: #085041; }
    .tag-open  { background: #FAEEDA; color: #633806; }
    .tag-biz   { background: #FAECE7; color: #993C1D; }
    .tag-think { background: var(--info-bg); color: var(--info-text); }

    .q-meta { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .q-text { font-size: 16px; line-height: 1.75; margin-bottom: 1.25rem; }

    .reveal-btn {
      width: 100%; padding: 10px; font-size: 14px;
      border: 0.5px solid var(--border-hover); background: var(--bg-secondary);
      color: var(--text-primary); border-radius: var(--radius-md);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 8px; transition: all .15s; font-family: inherit;
    }
    .reveal-btn:hover { background: var(--bg); }

    .answer-box { margin-top: 1rem; border-top: 0.5px solid var(--border); padding-top: 1rem; display: none; }
    .answer-box.open { display: block; }
    .ans-label { font-size: 12px; font-weight: 500; color: var(--success-text); letter-spacing: .04em; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .ans-text { font-size: 15px; font-weight: 500; line-height: 1.7; margin-bottom: 1rem; }
    .exp-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); letter-spacing: .04em; margin-bottom: 6px; }
    .exp-text { font-size: 14px; color: var(--text-secondary); line-height: 1.85; white-space: pre-wrap; }

    .footer-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .fn-btn {
      padding: 9px 20px; font-size: 14px;
      border: 0.5px solid var(--border-hover); background: var(--bg);
      color: var(--text-primary); border-radius: var(--radius-md);
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      font-family: inherit; transition: background .15s;
    }
    .fn-btn:hover { background: var(--bg-secondary); }
    .fn-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }
    .fn-btn.next { background: var(--info-bg); color: var(--info-text); border-color: transparent; font-weight: 500; }
    .fn-btn.next:hover { opacity: .85; }

    .counter { font-size: 13px; color: var(--text-secondary); text-align: center; min-width: 80px; }

    .loading { text-align: center; padding: 3rem; color: var(--text-secondary); font-size: 15px; }
    .error { text-align: center; padding: 3rem; color: #993C1D; font-size: 14px; line-height: 1.6; }

    @media (max-width: 480px) {
      .fn-btn { padding: 9px 14px; font-size: 13px; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>M3対策クイズ v0.0.3</h1>
    <p>問題を読んで考えてから「正解・解説を見る」を押してください</p>
  </header>

  <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>

  <div id="quizArea"><div class="loading"><i class="ti ti-loader" aria-hidden="true"></i> 読み込み中...</div></div>

  <div class="footer-nav">
    <button class="fn-btn" id="prevBtn" onclick="goPrev()" disabled>
      <i class="ti ti-arrow-left" aria-hidden="true"></i> 前の問題
    </button>
    <span class="counter" id="counter"></span>
    <button class="fn-btn next" id="nextBtn" onclick="goNext()" disabled>
      次の問題 <i class="ti ti-arrows-shuffle" aria-hidden="true"></i>
    </button>
  </div>
</div>

<script>
// ── CSV parser (handles quoted fields with newlines) ──────────────────────
function parseCSV(text) {
  const rows = [];
  let i = 0;
  const n = text.length;

  function parseField() {
    if (text[i] === '"') {
      i++; // skip opening quote
      let val = '';
      while (i < n) {
        if (text[i] === '"' && text[i+1] === '"') { val += '"'; i += 2; }
        else if (text[i] === '"') { i++; break; }
        else { val += text[i++]; }
      }
      return val;
    } else {
      let val = '';
      while (i < n && text[i] !== ',' && text[i] !== '\n') {
        if (text[i] === '\r') { i++; continue; }
        val += text[i++];
      }
      return val;
    }
  }

  // parse header
  const header = [];
  while (i < n && text[i] !== '\n') {
    header.push(parseField());
    if (text[i] === ',') i++;
  }
  if (text[i] === '\n') i++;

  // parse rows
  while (i < n) {
    if (text[i] === '\r' || text[i] === '\n') { i++; continue; }
    const row = {};
    for (let h = 0; h < header.length; h++) {
      row[header[h]] = parseField();
      if (text[i] === ',') i++;
    }
    if (Object.values(row).some(v => v !== '')) rows.push(row);
    if (text[i] === '\n') i++;
  }
  return rows;
}

// ── State ─────────────────────────────────────────────────────────────────
let questions = [];
let history = [];   // stack of indices into questions[]
let seen = new Set();

function pickNext() {
  // prefer unseen; reset when all seen
  let pool = questions.map((_,i)=>i).filter(i => !seen.has(i));
  if (pool.length === 0) { seen.clear(); pool = questions.map((_,i)=>i); }
  // avoid repeating current
  const cur = history[history.length - 1];
  const choices = pool.length > 1 ? pool.filter(i => i !== cur) : pool;
  return choices[Math.floor(Math.random() * choices.length)];
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const idx = history[history.length - 1];
  const q = questions[idx];
  const pos = history.length;
  const total = questions.length;

  document.getElementById('progressBar').style.width = `${Math.min((seen.size / total) * 100, 100)}%`;
  document.getElementById('counter').textContent = `${pos} 問目 / 全${total}問`;
  document.getElementById('prevBtn').disabled = history.length <= 1;
  document.getElementById('nextBtn').disabled = false;

  document.getElementById('quizArea').innerHTML = `
    <div class="card" id="quizCard">
      <span class="tag ${q.tagClass}">${q.tag}</span>
      <div class="q-meta">問題 No.${q.id}</div>
      <p class="q-text">${escHtml(q.q)}</p>
      <button class="reveal-btn" id="revealBtn" onclick="toggleAnswer()">
        <i class="ti ti-eye" aria-hidden="true"></i> 正解・解説を見る
      </button>
      <div class="answer-box" id="answerBox">
        <div class="ans-label"><i class="ti ti-check" aria-hidden="true"></i> 正解</div>
        <p class="ans-text">${escHtml(q.a)}</p>
        <div class="exp-label">解説</div>
        <p class="exp-text">${escHtml(q.exp)}</p>
      </div>
    </div>`;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleAnswer() {
  const box = document.getElementById('answerBox');
  const btn = document.getElementById('revealBtn');
  const open = box.classList.toggle('open');
  btn.innerHTML = open
    ? '<i class="ti ti-eye-off" aria-hidden="true"></i> 閉じる'
    : '<i class="ti ti-eye" aria-hidden="true"></i> 正解・解説を見る';
}

function goNext() {
  const next = pickNext();
  seen.add(next);
  history.push(next);
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function goPrev() {
  if (history.length <= 1) return;
  history.pop();
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// ── Load CSV ───────────────────────────────────────────────────────────────
fetch('questions.csv')
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.text();
  })
  .then(text => {
    questions = parseCSV(text).filter(r => r.q && r.q.trim());
    if (questions.length === 0) throw new Error('問題データが空です');
    // start with a random question
    const first = Math.floor(Math.random() * questions.length);
    seen.add(first);
    history = [first];
    render();
  })
  .catch(err => {
    document.getElementById('quizArea').innerHTML =
      `<div class="error"><i class="ti ti-alert-circle" aria-hidden="true"></i><br><br>
      CSVの読み込みに失敗しました。<br><code>questions.csv</code> が同じフォルダにあるか確認してください。<br><br>
      <small>${err.message}</small></div>`;
  });
</script>
</body>
</html>

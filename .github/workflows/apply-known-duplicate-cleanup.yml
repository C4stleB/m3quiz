name: Apply known duplicate cleanup

on:
  push:
    branches: [agent/data-deduplicate]
    paths:
      - scripts/remove-known-duplicates.mjs
      - .github/workflows/apply-known-duplicate-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/data-deduplicate
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/remove-known-duplicates.mjs
      - run: npm run check
      - name: Commit cleaned dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questions.csv
          git diff --cached --quiet || git commit -m "remove exact duplicate questions"
          git push
